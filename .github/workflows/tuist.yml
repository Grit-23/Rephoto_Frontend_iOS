name: Tuist

# Tuist 멀티모듈(Rephoto/) 빌드 · 테스트 게이트.
# 기존 iOS.yml(Rephoto_iOS.xcodeproj)은 Feature 이관 후 최종 통합 검증까지 함께 돈다.
# 로컬과 같은 Rephoto/Makefile과 Tuist 전용 Rephoto.xctestplan을 쓴다.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Rephoto
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install tuist · mockolo (mise.toml)
        uses: jdx/mise-action@v2
        with:
          working_directory: Rephoto
          install: true
          cache: true

      - name: Cache Tuist dependencies
        uses: actions/cache@v5
        with:
          path: Rephoto/Tuist/.build
          key: ${{ runner.os }}-tuist-${{ hashFiles('Rephoto/Tuist/Package.resolved', 'Rephoto/Tuist/Package.swift', 'Rephoto/mise.toml') }}
          restore-keys: ${{ runner.os }}-tuist-

      # 폴더를 추가하고 make modules를 빼먹으면 enum과 폴더가 어긋난다.
      - name: Check module enum
        run: |
          ./Scripts/generate-modules
          git diff --exit-code -- Plugins/

      # Feature는 다른 Feature · Domain의 구현 모듈을 import하지 않는다 (Interface만 허용).
      # Example 앱과 Tests는 자기 Feature 구현을 import해야 하므로 검사에서 뺀다.
      # `public import` · `@preconcurrency import` 같은 변형도 잡는다.
      - name: Check feature imports
        run: |
          if grep -rEn --include='*.swift' --exclude-dir=Example --exclude-dir=Tests \
               '^(@[A-Za-z_]+ )*(public |package |internal |fileprivate |private )?import [A-Za-z0-9]+(Feature|Domain)$' \
               Projects/Feature 2>/dev/null; then
            echo "::error::Feature가 구현 모듈을 import한다. Interface 모듈을 import한다."
            exit 1
          fi

      - name: Install dependencies
        run: make install

      - name: Generate
        run: make generate

      # 선언하지 않고 import한 의존성 · 선언만 하고 쓰지 않는 의존성을 잡는다.
      - name: Inspect dependencies
        run: mise exec -- tuist inspect dependencies

      # 기기 이름에 묶이지 않도록 generic 목적지로 빌드한다.
      - name: Build
        run: make build

      - name: Test
        run: make test TEST_DESTINATION='platform=iOS Simulator,name=iPhone 17 Pro'
